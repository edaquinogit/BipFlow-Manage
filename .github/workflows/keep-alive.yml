name: Keep backend warm

# Manual, on-demand only. Fires a single request at the production backend to
# wake the whole stack (Render container + Neon Postgres) before a demo or a
# smoke check -- run it from the Actions tab when you need the backend hot.
#
# The scheduled trigger was removed on purpose (zero-cost audit, P0): pinging
# a DB-backed endpoint every few minutes kept Neon's free compute from ever
# auto-suspending and burned through the monthly compute-hour quota. The
# project is demo/MVP with no revenue -- cold start on the first real visit is
# acceptable, so nothing keeps the stack warm 24/7 anymore. External uptime
# monitoring (UptimeRobot) should hit /healthz/ instead, which never touches
# Neon, on a slow cadence just to alert on hard downtime.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a DB-backed public endpoint
        run: |
          curl -sf --max-time 55 "https://bipflow-backend.onrender.com/api/v1/store/current/" > /dev/null \
            && echo "Backend responded" \
            || echo "::warning::Keep-alive ping failed or timed out"
